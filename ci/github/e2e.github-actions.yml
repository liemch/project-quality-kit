# GitHub Actions — Quality Kit smoke (clone *-quality)
name: quality-e2e-smoke

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ vars.QUALITY_KIT_DIR || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: |
          npm ci || npm install --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Smoke
        env:
          CI: true
        run: npm run test:e2e:smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ vars.QUALITY_KIT_DIR || '.' }}/playwright-report/
            ${{ vars.QUALITY_KIT_DIR || '.' }}/test-results/
          if-no-files-found: ignore
